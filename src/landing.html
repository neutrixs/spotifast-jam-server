<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotifast jam server</title>
<style>
  :root { --bg: #f6f6f4; --fg: #161616; --muted: #5d5d5a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121212; --fg: #f1f1f1; --muted: #a7a7a7; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 480px; margin: 12vh auto; padding: 0 16px; }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Spotifast jam server</h1>
  <p>This server keeps Spotifast jams in sync. To use it, enter this page's address when you
     choose <strong>Start a jam</strong> under the speaker button in Spotifast.</p>
</main>
</body>
</html>
