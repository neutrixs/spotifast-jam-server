<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join jam {{CODE}}</title>
<style>
  :root { --bg: #f6f6f4; --fg: #161616; --muted: #5d5d5a; --accent: #1db954; --card: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --fg: #f1f1f1; --muted: #a7a7a7; --card: #1e1e1e; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 440px; margin: 12vh auto; padding: 0 16px; }
  .card { background: var(--card); border-radius: 14px; padding: 28px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .code { font: 600 34px/1.2 ui-monospace, monospace; letter-spacing: 0.12em; margin: 16px 0; }
  a.button { display: inline-block; background: var(--accent); color: #000; text-decoration: none;
             font-weight: 600; padding: 10px 22px; border-radius: 999px; }
  p { color: var(--muted); }
  input { width: 100%; box-sizing: border-box; font: 13px ui-monospace, monospace; padding: 8px;
          border-radius: 8px; border: 1px solid #8884; background: transparent; color: var(--fg); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>You're invited to a jam</h1>
    <p>Listen together in Spotifast.</p>
    <div class="code">{{CODE}}</div>
    <a class="button" id="open" href="#">Open in Spotifast</a>
    <p>Nothing happened? In Spotifast, click the speaker button (<strong>Connect to a device</strong>) and paste this link under <strong>Jam</strong>:</p>
    <input id="link" readonly onclick="this.select()">
  </div>
</main>
<script>
  // The server's own address, whatever path a reverse proxy serves it under.
  var server = location.href.replace(/\/jam\/[^\/?#]+.*$/, "");
  var app = "spotifast-jam://join?server=" + encodeURIComponent(server) + "&session={{CODE}}";
  document.getElementById("open").href = app;
  document.getElementById("link").value = location.href.split(/[?#]/)[0];
  location.href = app;
</script>
</body>
</html>
